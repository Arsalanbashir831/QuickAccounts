services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: quickaccounts
      POSTGRES_USER: quickaccounts_owner
      POSTGRES_PASSWORD: owner-development-only
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/vps/init-runtime-role.sql:/docker-entrypoint-initdb.d/10-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickaccounts_owner -d quickaccounts"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-cache:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  redis-broker:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_broker_data:/data

volumes:
  postgres_data:
  redis_broker_data:
